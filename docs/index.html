<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit Recognition AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #111318; color: #f0f0f0;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 12px 48px;
  }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: #9aa0aa; margin-bottom: 20px; font-size: .95rem; text-align: center; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .card { background: #1b1e24; border-radius: 12px; padding: 16px; }
  #pad {
    touch-action: none; cursor: crosshair;
    border-radius: 8px; display: block;
    width: min(78vw, 320px); height: min(78vw, 320px);
  }
  .btns { display: flex; gap: 10px; margin-top: 12px; }
  button {
    flex: 1; padding: 12px; font-size: 1rem; border: none; border-radius: 8px;
    cursor: pointer; font-weight: 600;
  }
  #predictBtn { background: #4a7de2; color: #fff; }
  #clearBtn { background: #2a2e36; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .result { min-width: min(86vw, 320px); }
  .big { font-size: 4rem; font-weight: 800; text-align: center; line-height: 1; }
  .big small { font-size: 1rem; color: #9aa0aa; display: block; font-weight: 400; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: .85rem; }
  .bar .lbl { width: 12px; text-align: right; color: #9aa0aa; }
  .bar .track { flex: 1; background: #2a2e36; border-radius: 4px; height: 16px; overflow: hidden; }
  .bar .fill { background: #4a7de2; height: 100%; width: 0%; transition: width .2s; }
  .bar.top .fill { background: #37c26a; }
  .bar .pct { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  #seen, #heatmap { image-rendering: pixelated; width: 84px; height: 84px; border-radius: 6px; background: #000; display: block; margin: 0 auto; }
  .seenrow { display: flex; align-items: flex-start; justify-content: center; gap: 20px; margin-top: 12px; color: #9aa0aa; font-size: .8rem; text-align: center; }
  #status { margin-top: 12px; color: #9aa0aa; font-size: .85rem; text-align: center; min-height: 1.2em; }
  .corrBtn { padding: 6px 0; font-size: 0.9rem; background: #1b1e24; color: #fff; border: 1px solid #4a7de2; border-radius: 4px; flex: 1; min-width: 28px; }
  .corrBtn:hover { background: #4a7de2; }
</style>
</head>
<body>
  <h1>✍️ Digit Recognition AI</h1>
  <p class="sub">Draw a digit (0–9) and the AI will try to guess it.<br><span id="arch">Model: feedforward network trained on MNIST.</span></p>

  <div class="wrap">
    <div class="card">
      <canvas id="pad" width="280" height="280"></canvas>
      <div class="btns">
        <button id="predictBtn" disabled>Predict</button>
        <button id="clearBtn">Clear</button>
      </div>
      <div id="status">Loading model…</div>
    </div>

    <div class="card result">
      <div class="big"><span id="digit">–</span><small id="conf"></small></div>
      <div id="bars" style="margin-top:12px"></div>
      <div class="seenrow">
        <div>
          <canvas id="seen" width="28" height="28"></canvas>
          <span style="display:block; margin-top:4px;">The 28×28 image<br>the network sees</span>
        </div>
        <div>
          <canvas id="heatmap" width="28" height="28"></canvas>
          <span style="display:block; margin-top:4px;">AI Analysis<br><span style="color:#37c26a">Green</span>=Helped, <span style="color:#e24a4a">Red</span>=Hurt</span>
        </div>
      </div>
      
      <div id="correction" style="display:none; margin-top:20px; background:#2a2e36; padding:12px; border-radius:8px;">
        <div style="font-size:0.85rem; color:#9aa0aa; margin-bottom:8px; text-align:center;">Wrong guess? Teach the AI (Online Learning):</div>
        <div style="display:flex; gap:4px; justify-content:center; flex-wrap:wrap;">
          <button class="corrBtn" data-val="0">0</button>
          <button class="corrBtn" data-val="1">1</button>
          <button class="corrBtn" data-val="2">2</button>
          <button class="corrBtn" data-val="3">3</button>
          <button class="corrBtn" data-val="4">4</button>
          <button class="corrBtn" data-val="5">5</button>
          <button class="corrBtn" data-val="6">6</button>
          <button class="corrBtn" data-val="7">7</button>
          <button class="corrBtn" data-val="8">8</button>
          <button class="corrBtn" data-val="9">9</button>
        </div>
        <div style="margin-top:12px; display:flex; justify-content:center;">
          <button id="downloadBtn" style="background:#37c26a; padding:8px 16px; border:none; border-radius:4px; color:#fff; cursor:pointer; font-weight:bold; font-size:0.9rem;">📥 Download as 28x28 PNG for Dataset</button>
        </div>
      </div>
    </div>
  </div>

<script src="app.js?v=6"></script>
</body>
</html>
